<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-grad)" rx="16"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Top Navigation Header Bar -->
  <rect x="24" y="20" width="1152" height="56" fill="#1e293b" rx="12" stroke="#334155"/>
  <circle cx="52" cy="48" r="14" fill="url(#emerald-grad)"/>
  <path d="M 46 48 L 52 42 L 58 48 L 52 54 Z" fill="#ffffff"/>
  
  <text x="78" y="53" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#f8fafc">Logo-go Studio</text>
  <rect x="210" y="38" width="90" height="20" fill="#065f46" rx="10"/>
  <text x="255" y="52" font-family="monospace" font-weight="700" font-size="10" fill="#34d399" text-anchor="middle">v2.5 AI VEO</text>

  <!-- Live Status Badge -->
  <rect x="1020" y="36" width="132" height="24" fill="#059669" rx="12"/>
  <circle cx="1038" cy="48" r="4" fill="#a7f3d0"/>
  <text x="1084" y="53" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">LIVE APP ACTIVE</text>

  <!-- LEFT PANEL: Vision Input & Controls -->
  <rect x="24" y="92" width="360" height="560" fill="url(#card-grad)" rx="16" stroke="#334155"/>
  <text x="44" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#38bdf8">VISION INPUT ENGINE</text>

  <!-- Prompt Box -->
  <rect x="44" y="140" width="320" height="110" fill="#0f172a" rx="10" stroke="#334155"/>
  <text x="56" y="165" font-family="sans-serif" font-size="12" fill="#94a3b8">Group: <tspan fill="#f8fafc" font-weight="600">"Studio Vanguard"</tspan></text>
  <text x="56" y="188" font-family="sans-serif" font-size="12" fill="#94a3b8">Mission: <tspan fill="#f8fafc" font-weight="600">"Pioneer sustainable tech &amp; speed"</tspan></text>
  <text x="56" y="211" font-family="sans-serif" font-size="12" fill="#94a3b8">Impression: <tspan fill="#f8fafc" font-weight="600">"Sleek, confident, minimalist"</tspan></text>
  <text x="56" y="234" font-family="sans-serif" font-size="12" fill="#94a3b8">Colors: <tspan fill="#34d399" font-weight="600">"Emerald green, matte black, gold"</tspan></text>

  <!-- Quick Tags -->
  <rect x="44" y="262" width="98" height="22" fill="#1e293b" rx="6" stroke="#475569"/>
  <text x="93" y="277" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">+ Initials "A.R."</text>
  
  <rect x="148" y="262" width="105" height="22" fill="#1e293b" rx="6" stroke="#475569"/>
  <text x="200" y="277" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">+ Geometric Crest</text>

  <rect x="259" y="262" width="105" height="22" fill="#1e293b" rx="6" stroke="#475569"/>
  <text x="311" y="277" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">+ 3D Metallic</text>

  <!-- Style Selector -->
  <text x="44" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#64748b">AESTHETIC STYLE</text>
  <rect x="44" y="324" width="98" height="32" fill="#059669" rx="8"/>
  <text x="93" y="344" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Minimalist</text>

  <rect x="150" y="324" width="98" height="32" fill="#0f172a" rx="8" stroke="#334155"/>
  <text x="199" y="344" font-family="sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">3D Metallic</text>

  <rect x="256" y="324" width="108" height="32" fill="#0f172a" rx="8" stroke="#334155"/>
  <text x="310" y="344" font-family="sans-serif" font-weight="600" font-size="11" fill="#94a3b8" text-anchor="middle">Cyberpunk</text>

  <!-- Action Buttons -->
  <rect x="44" y="378" width="320" height="48" fill="url(#emerald-grad)" rx="12" filter="url(#subtle-glow)"/>
  <text x="204" y="407" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">✨ CREATE VECTOR EMBLEM</text>

  <rect x="44" y="438" width="320" height="44" fill="#0f172a" rx="12" stroke="#059669" stroke-width="2"/>
  <text x="204" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#34d399" text-anchor="middle">25× CREATE VARIATIONS GRID</text>

  <!-- Session Gallery Button -->
  <rect x="44" y="494" width="320" height="40" fill="#1e293b" rx="10" stroke="#334155"/>
  <text x="204" y="519" font-family="monospace" font-weight="700" font-size="11" fill="#94a3b8" text-anchor="middle">🎨 Open Session Gallery (25 Saved)</text>

  <!-- CENTER/RIGHT STAGE: Motion Video & Logo Stage -->
  <rect x="404" y="92" width="772" height="560" fill="url(#card-grad)" rx="16" stroke="#334155"/>

  <!-- Logo Canvas Box -->
  <rect x="428" y="116" width="480" height="420" fill="#020617" rx="16" stroke="#1e293b"/>
  
  <!-- Glowing Orbit Ring -->
  <circle cx="668" cy="300" r="130" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="12 8" filter="url(#glow)" opacity="0.8"/>
  <circle cx="668" cy="300" r="100" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Main Vector Emblem Icon -->
  <g transform="translate(668, 290)" filter="url(#glow)">
    <!-- Abstract V Shield -->
    <path d="M -50 -60 L 0 50 L 50 -60 L 25 -60 L 0 10 L -25 -60 Z" fill="url(#emerald-grad)"/>
    <!-- Outer Crest Wing -->
    <path d="M -70 -40 L -20 60 L 0 60 L -45 -40 Z" fill="#34d399"/>
    <path d="M 70 -40 L 20 60 L 0 60 L 45 -40 Z" fill="url(#gold-grad)"/>
  </g>

  <!-- Emblem Text -->
  <text x="668" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="1">STUDIO VANGUARD</text>
  <text x="668" y="438" font-family="monospace" font-weight="600" font-size="11" fill="#10b981" text-anchor="middle">INIT: A.R. • SUSTAINABLE TECH</text>

  <!-- Video Control Bar Overlay -->
  <rect x="444" y="480" width="448" height="40" fill="#0f172a" rx="10" opacity="0.9" stroke="#334155"/>
  <circle cx="470" cy="500" r="12" fill="#059669"/>
  <polygon points="467,494 476,500 467,506" fill="#ffffff"/>
  <rect x="494" y="498" width="230" height="4" fill="#334155" rx="2"/>
  <rect x="494" y="498" width="140" fill="#10b981" height="4" rx="2"/>
  <circle cx="634" cy="500" r="6" fill="#ffffff"/>
  <text x="740" y="504" font-family="monospace" font-size="10" fill="#94a3b8">0:04 / 0:08</text>
  <rect x="800" y="490" width="80" height="20" fill="#020617" rx="6" stroke="#059669"/>
  <text x="840" y="504" font-family="monospace" font-weight="700" font-size="9" fill="#34d399" text-anchor="middle">16:9 VEO HD</text>

  <!-- RIGHT SIDEBAR: 25 Variations Thumbnails -->
  <rect x="924" y="116" width="228" height="512" fill="#0f172a" rx="12" stroke="#1e293b"/>
  <text x="940" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#cbd5e1">25 VARIATIONS GRID</text>

  <!-- Thumb 1 -->
  <rect x="940" y="156" width="94" height="94" fill="#1e293b" rx="8" stroke="#059669" stroke-width="2"/>
  <circle cx="987" cy="195" r="22" fill="none" stroke="#10b981" stroke-width="3"/>
  <path d="M 980 195 L 994 195 M 987 188 L 987 202" stroke="#fbbf24" stroke-width="3"/>
  <text x="987" y="240" font-family="sans-serif" font-size="9" fill="#34d399" text-anchor="middle">Selected</text>

  <!-- Thumb 2 -->
  <rect x="1044" y="156" width="94" height="94" fill="#1e293b" rx="8" stroke="#334155"/>
  <polygon points="1091,175 1110,210 1072,210" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="1091" y="240" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Geometric</text>

  <!-- Thumb 3 -->
  <rect x="940" y="260" width="94" height="94" fill="#1e293b" rx="8" stroke="#334155"/>
  <rect x="965" y="280" width="44" height="44" fill="none" stroke="#a855f7" stroke-width="3" rx="6"/>
  <text x="987" y="344" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Cyber HUD</text>

  <!-- Thumb 4 -->
  <rect x="1044" y="260" width="94" height="94" fill="#1e293b" rx="8" stroke="#334155"/>
  <path d="M 1070 300 Q 1091 270 1112 300" fill="none" stroke="#f43f5e" stroke-width="3"/>
  <text x="1091" y="344" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Line Art</text>

  <!-- Thumb 5 -->
  <rect x="940" y="364" width="94" height="94" fill="#1e293b" rx="8" stroke="#334155"/>
  <circle cx="987" cy="401" r="20" fill="#059669"/>
  <text x="987" y="448" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Badge Crest</text>

  <!-- Thumb 6 -->
  <rect x="1044" y="364" width="94" height="94" fill="#1e293b" rx="8" stroke="#334155"/>
  <path d="M 1075 385 L 1107 417 M 1107 385 L 1075 417" stroke="#fbbf24" stroke-width="3"/>
  <text x="1091" y="448" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Vintage</text>

  <!-- More variations pill -->
  <rect x="940" y="470" width="198" height="36" fill="#020617" rx="8" stroke="#334155"/>
  <text x="1039" y="492" font-family="monospace" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">+ 19 More Concept Variations</text>

  <!-- Bottom Motion Physics Bar -->
  <rect x="428" y="552" width="480" height="76" fill="#0f172a" rx="12" stroke="#1e293b"/>
  <text x="444" y="574" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#94a3b8">INTERACTIVE MOTION PHYSICS PRESETS</text>

  <rect x="444" y="584" width="80" height="28" fill="#059669" rx="6"/>
  <text x="484" y="602" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">3D Spin</text>

  <rect x="532" y="584" width="80" height="28" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="572" y="602" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Pulse</text>

  <rect x="620" y="584" width="80" height="28" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="660" y="602" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Glow</text>

  <rect x="708" y="584" width="80" height="28" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="748" y="602" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Float Orbit</text>

  <rect x="796" y="584" width="100" height="28" fill="#1e293b" rx="6" stroke="#334155"/>
  <text x="846" y="602" font-family="sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Shimmer</text>

</svg>
